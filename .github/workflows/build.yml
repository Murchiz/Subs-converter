name: Build, Test and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ci:
    name: CI Build & Test
    runs-on: windows-latest

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.11

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Configure CMake (CI Preset)
        run: cmake --preset ci

      - name: Build Project (CI Preset)
        run: cmake --build --preset ci

      - name: Run CTest Suite
        run: ctest --preset ci --output-on-failure

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  release:
    name: Production Release
    runs-on: windows-latest
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Determine Version & Tag
        id: version_info
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $inputVersion = "${{ inputs.version }}".Trim()

          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              $cleanVer = $refName.TrimStart('vV')
              $tag = $refName
          } elseif ($inputVersion -ne "") {
              $cleanVer = $inputVersion.TrimStart('vV')
              $tag = "v$cleanVer"
          } else {
              $cleanVer = "1.0.${{ github.run_number }}"
              $tag = "v$cleanVer"
          }

          Write-Host "Configured Version: $cleanVer"
          Write-Host "Configured Tag: $tag"
          "PROJECT_VERSION=$cleanVer" >> $env:GITHUB_ENV
          "TAG_NAME=$tag" >> $env:GITHUB_ENV
          "project_version=$cleanVer" >> $env:GITHUB_OUTPUT
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure CMake (Release Preset)
        run: cmake --preset release -D "PROJECT_VERSION=${{ env.PROJECT_VERSION }}"

      - name: Build Project (Release Preset)
        run: cmake --build --preset release

      - name: Run CTest Suite (Release Preset)
        run: ctest --preset release --output-on-failure

      - name: Prepare Package Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item build/release/sub_bridge.exe -Destination package/
          Copy-Item config.ini.example -Destination package/
          Compress-Archive -Path package/* -DestinationPath sub_bridge-windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sub_bridge-windows-x64
          path: sub_bridge-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sub_bridge-windows-x64.zip
            build/release/sub_bridge.exe
            config.ini.example
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
