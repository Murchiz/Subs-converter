name: Build, Test and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build & Test (Windows Release)
    runs-on: windows-latest

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.11

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Configure CMake
        run: cmake --preset ci

      - name: Build Project
        run: cmake --build --preset ci

      - name: Run CTest Suite
        run: ctest --preset ci --output-on-failure

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Prepare Package Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item build/ci/sub_bridge.exe -Destination package/
          Copy-Item config.ini.example -Destination package/
          Compress-Archive -Path package/* -DestinationPath sub_bridge-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sub_bridge-windows-x64
          path: sub_bridge-windows-x64.zip

      - name: Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.release == 'true' && github.event_name == 'workflow_dispatch'))
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sub_bridge-windows-x64.zip
            build/ci/sub_bridge.exe
            config.ini.example
          tag_name: ${{ github.ref_name || format('v{0}', github.run_number) }}
          name: Release ${{ github.ref_name || format('v{0}', github.run_number) }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
