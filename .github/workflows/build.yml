name: Build, Test and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ci:
    name: CI Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla/sccache-action@v0.0.11

      - name: Configure Windows Compiler Launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
          "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 libcurl4-openssl-dev ninja-build ccache
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Set up ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ci

      - name: Configure Linux Compiler Launcher
        if: runner.os == 'Linux'
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Configure CMake (CI Preset)
        run: cmake --preset ci

      - name: Build Project (CI Preset)
        run: cmake --build --preset ci

      - name: Run CTest Suite
        run: ctest --preset ci --output-on-failure

      - name: Show sccache stats (Windows)
        if: always() && runner.os == 'Windows'
        run: sccache --show-stats

      - name: Show ccache stats (Linux)
        if: always() && runner.os == 'Linux'
        run: ccache -s

  release-build:
    name: Build Release Binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 libcurl4-openssl-dev ninja-build
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Determine Version & Tag
        id: version_info
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $inputVersion = "${{ inputs.version }}".Trim()

          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              $cleanVer = $refName.TrimStart('vV')
              $tag = $refName
          } elseif ($inputVersion -ne "") {
              $cleanVer = $inputVersion.TrimStart('vV')
              $tag = "v$cleanVer"
          } else {
              $cleanVer = "1.0.${{ github.run_number }}"
              $tag = "v$cleanVer"
          }

          Write-Host "Configured Version: $cleanVer"
          Write-Host "Configured Tag: $tag"
          "PROJECT_VERSION=$cleanVer" >> $env:GITHUB_ENV
          "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Configure CMake (Release Preset)
        run: cmake --preset release -D "PROJECT_VERSION=${{ env.PROJECT_VERSION }}"

      - name: Build Project (Release Preset)
        run: cmake --build --preset release

      - name: Run CTest Suite (Release Preset)
        run: ctest --preset release --output-on-failure

      - name: Prepare Windows Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item build/release/sub_bridge.exe -Destination package/
          Copy-Item config.ini.example -Destination package/
          Compress-Archive -Path package/* -DestinationPath sub_bridge-windows-x64.zip

      - name: Prepare Linux Package
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp build/release/sub_bridge package/
          cp config.ini.example package/
          tar -czf sub_bridge-linux-x64.tar.gz -C package .

      - name: Upload Artifact Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: sub_bridge-windows-x64
          path: sub_bridge-windows-x64.zip

      - name: Upload Artifact Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: sub_bridge-linux-x64
          path: sub_bridge-linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Windows Artifact
        uses: actions/download-artifact@v7
        with:
          name: sub_bridge-windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v7
        with:
          name: sub_bridge-linux-x64

      - name: Determine Tag Name
        id: tag_calc
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $inputVersion = "${{ inputs.version }}".Trim()
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              $tag = $refName
          } elseif ($inputVersion -ne "") {
              $cleanVer = $inputVersion.TrimStart('vV')
              $tag = "v$cleanVer"
          } else {
              $tag = "v1.0.${{ github.run_number }}"
          }
          "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sub_bridge-windows-x64.zip
            sub_bridge-linux-x64.tar.gz
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

