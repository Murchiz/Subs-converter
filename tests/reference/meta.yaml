mixed-port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
proxies:
  - name: Germany
    type: vless
    server: example.org
    port: 47005
    uuid: example-uuid-0000-0000-0000-00000000
    udp: true
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: example.com
    client-fingerprint: firefox
    reality-opts:
      public-key: example-public-key
      short-id: 
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - Germany
  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - Germany
rules:
  - DOMAIN-SUFFIX,img.avito.st,REJECT
  - IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
  - MATCH,Proxy
